server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml
    font/woff2;

  # Assets con hash en el nombre -> caché larga (Vite los versiona automáticamente)
  location ~* /assets/.*\.(js|css|woff2|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html nunca se cachea para que los deploys apliquen de inmediato
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # Proxy al backend
  location /api/ {
    proxy_pass         http://validador-backend:8080/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
  }

  # WebSocket (STOMP) para notificaciones en tiempo real
  location /ws {
    proxy_pass         http://validador-backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
  }
}
