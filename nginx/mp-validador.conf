# ============================================================
# mp-validador — config para agregar al nginx-proxy compartido del VPS
# NO reemplaza default.conf, va como archivo separado
# Copiar con: docker cp nginx/mp-validador.conf nginx-proxy:/etc/nginx/conf.d/mp-validador.conf
# Recargar:   docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
# ============================================================

# HTTP → HTTPS + challenge certbot
server {
    listen 80;
    server_name mpvalidador.online www.mpvalidador.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend + API (proxeada internamente por el nginx del propio frontend) + WS
server {
    listen 443 ssl;
    server_name mpvalidador.online www.mpvalidador.online;

    ssl_certificate     /etc/letsencrypt/live/mpvalidador.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mpvalidador.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s;  # re-resuelve DNS cada 10s cuando el contenedor cambia de IP

    access_log /var/log/nginx/mp-validador-access.log;
    error_log  /var/log/nginx/mp-validador-error.log warn;

    location / {
        set $upstream_frontend http://mp-validador-frontend:80;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
